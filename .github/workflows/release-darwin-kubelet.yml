name: Release Darwin kubelet

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag to create or update"
        required: true
        type: string
      artifact_version:
        description: "Artifact suffix; defaults to the release tag"
        required: false
        type: string
      draft:
        description: "Create the release as a draft when it does not exist"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the release as a prerelease when it does not exist"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "kubelet-darwin-arm64-k8s-v1.36.3-*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish darwin/arm64 kubelet
    # GitHub's macos-15 hosted runner is arm64, which keeps the cgo-backed
    # Darwin stats path native and avoids cross-compiling Mach calls.
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_ARTIFACT_VERSION: ${{ inputs.artifact_version }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${INPUT_RELEASE_TAG}"
            artifact_version="${INPUT_ARTIFACT_VERSION}"
            draft="${INPUT_DRAFT}"
            prerelease="${INPUT_PRERELEASE}"
          else
            release_tag="${GITHUB_REF_NAME}"
            artifact_version="${GITHUB_REF_NAME#kubelet-darwin-arm64-k8s-v1.36.3-}"
            draft="false"
            prerelease="false"
          fi

          if [[ -z "${artifact_version}" ]]; then
            if [[ "${release_tag}" == kubelet-darwin-arm64-k8s-v1.36.3-* ]]; then
              artifact_version="${release_tag#kubelet-darwin-arm64-k8s-v1.36.3-}"
            else
              artifact_version="${release_tag}"
            fi
          fi

          kubernetes_baseline="v1.36.3"
          if [[ ! "${release_tag}" =~ ^kubelet-darwin-arm64-k8s-v1\.36\.3-[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "release tag must match kubelet-darwin-arm64-k8s-v1.36.3-<version>: ${release_tag}" >&2
            exit 1
          fi
          if [[ ! "${artifact_version}" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "artifact version contains unsupported characters: ${artifact_version}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${kubernetes_baseline}" HEAD; then
            echo "current commit is not based on Kubernetes ${kubernetes_baseline}" >&2
            exit 1
          fi

          artifact_name="kubelet-darwin-arm64-k8s-v1.36.3-${artifact_version}"
          git_commit="$(git rev-parse HEAD)"
          git_tree_state="clean"
          if [[ -n "$(git status --porcelain)" ]]; then
            git_tree_state="dirty"
          fi
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git_version="${kubernetes_baseline}"

          {
            echo "release_tag=${release_tag}"
            echo "artifact_version=${artifact_version}"
            echo "artifact_name=${artifact_name}"
            echo "kubernetes_baseline=${kubernetes_baseline}"
            echo "git_commit=${git_commit}"
            echo "git_tree_state=${git_tree_state}"
            echo "build_date=${build_date}"
            echo "git_version=${git_version}"
            echo "draft=${draft}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Test Darwin kubelet packages
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go test \
            ./cmd/kubelet \
            ./pkg/kubelet \
            ./pkg/kubelet/allocation \
            ./pkg/kubelet/cadvisor \
            ./pkg/kubelet/cm \
            ./pkg/kubelet/config \
            ./pkg/kubelet/kuberuntime \
            ./pkg/kubelet/stats \
            ./pkg/volume/downwardapi \
            ./pkg/volume/projected \
            ./pkg/volume/secret \
            ./pkg/volume/util/hostutil \
            ./pkg/volume/util/subpath

          (
            cd staging/src/k8s.io/mount-utils
            CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go test ./...
          )

      - name: Build kubelet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/root/bin dist/root/LICENSES

          ldflags=(
            "-s"
            "-w"
            "-X" "k8s.io/component-base/version.gitVersion=${{ steps.meta.outputs.git_version }}"
            "-X" "k8s.io/component-base/version.gitCommit=${{ steps.meta.outputs.git_commit }}"
            "-X" "k8s.io/component-base/version.gitTreeState=${{ steps.meta.outputs.git_tree_state }}"
            "-X" "k8s.io/component-base/version.buildDate=${{ steps.meta.outputs.build_date }}"
            "-X" "k8s.io/client-go/pkg/version.gitVersion=${{ steps.meta.outputs.git_version }}"
            "-X" "k8s.io/client-go/pkg/version.gitCommit=${{ steps.meta.outputs.git_commit }}"
            "-X" "k8s.io/client-go/pkg/version.gitTreeState=${{ steps.meta.outputs.git_tree_state }}"
            "-X" "k8s.io/client-go/pkg/version.buildDate=${{ steps.meta.outputs.build_date }}"
          )

          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build \
            -trimpath \
            -ldflags "${ldflags[*]}" \
            -o dist/root/bin/kubelet \
            ./cmd/kubelet

          kubelet_version="$(dist/root/bin/kubelet --version)"
          echo "${kubelet_version}"
          expected_version="Kubernetes ${{ steps.meta.outputs.git_version }}"
          if [[ "${kubelet_version}" != "${expected_version}" ]]; then
            echo "unexpected kubelet version: ${kubelet_version}; expected ${expected_version}" >&2
            exit 1
          fi

          cp LICENSE dist/root/LICENSES/kubernetes-LICENSE
          (cd dist/root && shasum -a 256 bin/kubelet > SHA256SUMS)

          cat > dist/root/manifest.json <<JSON
          {
            "artifact": "${{ steps.meta.outputs.artifact_name }}",
            "kubernetesBaseline": "${{ steps.meta.outputs.kubernetes_baseline }}",
            "kubernetesForkBranch": "macos-node/v1.36.3",
            "kubernetesCommit": "${{ steps.meta.outputs.git_commit }}",
            "gitVersion": "${{ steps.meta.outputs.git_version }}",
            "gitTreeState": "${{ steps.meta.outputs.git_tree_state }}",
            "buildDate": "${{ steps.meta.outputs.build_date }}",
            "goos": "darwin",
            "goarch": "arm64",
            "cgoEnabled": true
          }
          JSON

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="${{ steps.meta.outputs.artifact_name }}"
          tar -C dist/root -czf "dist/${artifact_name}.tar.gz" .
          (cd dist && shasum -a 256 "${artifact_name}.tar.gz" > "${artifact_name}.tar.gz.sha256")

      - name: Create or update GitHub Release
        env:
          ARTIFACT_NAME: ${{ steps.meta.outputs.artifact_name }}
          GH_TOKEN: ${{ github.token }}
          GIT_COMMIT: ${{ steps.meta.outputs.git_commit }}
          RELEASE_DRAFT: ${{ steps.meta.outputs.draft }}
          RELEASE_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          release_exists="false"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            release_exists="true"
          fi

          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" >/dev/null 2>&1 || true
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            existing_tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            if [[ "${existing_tag_commit}" != "${GIT_COMMIT}" ]]; then
              echo "release tag ${RELEASE_TAG} points to ${existing_tag_commit}, expected ${GIT_COMMIT}" >&2
              exit 1
            fi
          elif [[ "${release_exists}" == "true" ]]; then
            echo "release ${RELEASE_TAG} exists but its git tag could not be verified" >&2
            exit 1
          fi

          if [[ "${release_exists}" == "false" ]]; then
            release_create_args=(
              gh release create "${RELEASE_TAG}"
              --target "${GIT_COMMIT}"
              --title "${RELEASE_TAG}"
              --notes "Darwin arm64 kubelet for Kubernetes v1.36.3."
            )
            if [[ "${RELEASE_DRAFT}" == "true" ]]; then
              release_create_args+=(--draft)
            fi
            if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
              release_create_args+=(--prerelease)
            fi

            "${release_create_args[@]}"
          fi

          gh release upload "${RELEASE_TAG}" \
            "dist/${ARTIFACT_NAME}.tar.gz" \
            "dist/${ARTIFACT_NAME}.tar.gz.sha256" \
            --clobber
